# This workflow will run tests using node and then publish a package to GitHub Packages on every push
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Node.js Package

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest Cypress with cy.env() and the latest release
        cypress: ['15.10.0', 'latest']
    name: test (cypress ${{ matrix.cypress }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: cd test && npm ci
      - run: cd test && npm install --no-save cypress@${{ matrix.cypress }}
      - run: cd test && npm run cy:run
      - run: cd test && npx jest
  publish-gpr:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required by npm trusted publishing (OIDC): no NPM_TOKEN secret is used
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing requires Node >= 22.14.0 and npm >= 11.5.1
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - run: npm --version
      - run: npm ci
      - run: npm publish
